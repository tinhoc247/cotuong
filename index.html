async function tick(){var m=MM;if(!m||m.dead||m.join||S)return;var now=Date.now()+FB.off,P=m.P,me=FB.uid,k,fr=function(x){return x&&typeof x.t=='number'&&now-x.t<15000};
for(k in P)if(k!=me&&fr(P[k])&&P[k].inv==me&&P[k].room&&!m.skip[P[k].room]){m.join=1;var rm=P[k].room;try{if(await joinRoom(rm)){m.skip[rm]=1;m.join=0}}catch(e){m.skip[rm]=1;m.join=0}return}
if(m.host)return;var pool=Object.keys(P).filter(function(x){return fr(P[x])&&!P[x].inv}).sort();
if(pool[0]==me&&pool.length>1){m.host=1;var c=gen5();try{var R=await openRoom(c);O={R:R,code:c,role:'host',col:Math.random()<.5?1:-1,gn:1,sg:1,base:M.base,inc:M.inc};R.set({role:'host',col:O.col,gn:1,mv:'1:',nm:nmz(),base:M.base,inc:M.inc});R.cb=sync;await m.me.update({inv:pool[1],room:c});
m.ht=setTimeout(function(){if(!S&&MM===m){m.me.update({inv:null,room:null}).catch(noop);if(O){O.R.leave();O=null}m.host=0}},12000)}catch(e){m.host=0}}}
document.addEventListener('input',function(e){var i=e.target.id;if(i=='nm'){M.name=e.target.value;try{localStorage.setItem('xqn',M.name)}catch(x){}}if(i=='cd')M.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
/* ===== luật lặp lại: chiếu/đuổi liên tục bị xử thua, còn lại lặp 3 lần là hòa (đuổi: nước đi vừa rồi tấn công quân không được bảo vệ hoặc quân giá trị cao hơn; không tính Tướng, Tốt) ===== */
function chase(b,sd,t){var pt=Math.abs(b[t]),ms=gen(b,sd);for(var i=0;i<ms.length;i++){if(ms[i][0]!=t)continue;var x=ms[i][1],tx=Math.abs(b[x]);if(!tx||tx==5||tx==7)continue;var o=b[x];b[x]=sd;var pr=gen(b,-sd).some(function(m){return m[1]==x});b[x]=o;if(!pr||VAL[tx]>VAL[pt])return true}return false}
function rule(p,t){var b=S.b,sd=p>0?1:-1,h=S.hist[S.hist.length-1];h.c=chk(b,-sd);h.h=!h.c&&chase(b,sd,t);var k=b.join(',')+S.turn;S.keys.push(k);
var n=S.keys.length-1,a=-1,cnt=0,i;for(i=0;i<n;i++)if(S.keys[i]==k){cnt++;if(a<0)a=i}if(cnt<2||S.over)return;
var pc={1:1,'-1':1},pv={1:1,'-1':1};for(i=a;i<n;i++){var m=S.hist[i],sg=m.p>0?1:-1;if(!m.c)pc[sg]=0;if(!m.c&&!m.h)pv[sg]=0}
var w=0,why='Hòa do thế cờ lặp lại 3 lần.';
if(pc[1]!=pc[-1]){w=pc[1]?-1:1;why=(pc[1]?'Đỏ':'Đen')+' chiếu liên tục nên bị xử thua.'}
else if(!pc[1]&&pv[1]!=pv[-1]){w=pv[1]?-1:1;why=(pv[1]?'Đỏ':'Đen')+' chiếu hoặc đuổi quân liên tục nên bị xử thua.'}
S.over={win:w,rep:1,why:why}}
/* ===== đồng hồ: mỗi bên có tổng thời gian + cộng giờ mỗi nước; ba nước đầu (nước 1 và 2) không tính giờ ===== */
try{var tc=JSON.parse(localStorage.getItem('xqt2')||'null');if(tc&&[0,3,5,10,15,30].indexOf(tc[0])>=0&&[0,2,5].indexOf(tc[1])>=0){M.base=tc[0];M.inc=tc[1]}}catch(e){}
function ck(b,i){S.base=b*60000;S.inc=i*1000;S.left={1:S.base,'-1':S.base};S.ts=performance.now();S.keys=[S.b.join(',')+1]}
function fm(ms){var t=Math.ceil(Math.max(0,ms)/1000),m=(t/60)|0,x=t%60;return m+':'+(x<10?'0':'')+x}
function cur(c){var r=S.left[c];if(!S.over&&S.hist.length>=2&&S.turn==c)r-=performance.now()-S.ts;return r}
function upd(){if(!S||!S.base)return;[1,-1].forEach(function(c){var e=$('#k'+c);if(!e)return;var v=cur(c);e.className='clk'+(!S.over&&!S.cd&&S.turn==c?' on':'')+(v<30000?' low':'');e.innerHTML='<b>'+fm(v)+'</b>'})}
setInterval(function(){if(!S||!S.base||S.over)return;var c=0;[1,-1].forEach(function(x){if(cur(x)<=0)c=x});if(c){S.left[c]=0;S.over={win:-c,t:1};return show()}upd()},200);
menu();
})();
</script><script id="vk-js">
(function(){var T=null,OKA='',sh=true,K=null,R=['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM'],NM={jN:1,pname:1,nm:1,hwn:1};
function el(){return T?document.getElementById(T):null}
function isNm(){return !!NM[T]}
function build(){K=document.createElement('div');K.id='vk';K.addEventListener('mousedown',function(e){e.preventDefault()});
 K.addEventListener('click',function(e){var b=e.target.closest('button');if(b)key(b.getAttribute('data-k'))});document.body.appendChild(K)}
function draw(){var n=isNm(),lc=function(c){return /[A-Z]/.test(c)&&n&&!sh?c.toLowerCase():c};
 K.innerHTML=R.map(function(r,i){return '<div class="vr">'+(i==3&&n?'<button class="fn'+(sh?' on':'')+'" data-k="SH">⇧</button>':'')+r.split('').map(function(c){return '<button'+(i==0?' class="num"':'')+' data-k="'+lc(c)+'">'+lc(c)+'</button>'}).join('')+(i==3?'<button class="fn" data-k="BS">⌫</button>':'')+'</div>'}).join('')+
 '<div class="vr"><button class="cl" data-k="CL">✖ Đóng</button>'+(n?'<button class="sp" data-k=" ">␣ Dấu cách</button>':'')+'<button class="ok" data-k="OK">✔ Xong</button></div>'}
function ev(e){e.dispatchEvent(new Event('input',{bubbles:true}));if(isNm())sh=!e.value||/ $/.test(e.value);draw()}
function key(k){var e=el();if(!e)return close();
 if(k=='CL')return close();if(k=='SH'){sh=!sh;return draw()}
 if(k=='BS'){e.value=e.value.slice(0,-1);return ev(e)}
 if(k=='OK'){var id=T,a=OKA;close();if(a){try{new Function(a)()}catch(x){}}else if(id=='code'||id=='cd'){var b=document.querySelector('[data-act="join-room"],[data-a="join"]');if(b)b.click()}return}
 var m=+e.getAttribute('maxlength')||99;if(e.value.length>=m)return;e.value+=k;ev(e)}
function close(){if(K)K.style.display='none';document.body.style.paddingBottom='';var e=el();if(e)e.removeAttribute('inputmode');T=null;OKA=''}
function open(id,ok){var e=document.getElementById(id);if(!e)return;if(!K)build();if(T==id)return close();var o=el();if(o)o.removeAttribute('inputmode');T=id;OKA=ok||'';sh=isNm()?!e.value:true;e.setAttribute('inputmode','none');e.blur();draw();K.style.display='block';document.body.style.paddingBottom=K.offsetHeight+'px';setTimeout(function(){e.scrollIntoView({block:'center',behavior:'smooth'})},50)}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.vkb');if(b){e.preventDefault();open(b.getAttribute('data-vk'),b.getAttribute('data-ok'))}},true);
window.vk=open;
})();
